<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>เข้าสู่ระบบผู้ดูแลระบบ (Admin Login) | สำนักงานทนายความชั้น 1</title>
  <meta name="description" content="ระบบเข้าสู่ระบบสำหรับผู้ดูแลสำนักงานทนายความชั้น 1 ปลอดภัย รัดกุม">
  <link rel="stylesheet" href="../assets/css/style.css">
  <script>
    // หากมีการส่งคำสั่ง logout มา ให้ล้าง session ทันที
    (function() {
      const urlParams = new URLSearchParams(window.location.search);
      if (urlParams.get('logout') === 'true') {
        localStorage.removeItem('lawyer_admin_authenticated');
        localStorage.removeItem('lawyer_admin_email');
        localStorage.removeItem('lawyer_admin_login_at');
        sessionStorage.clear();
        return;
      }
      // หากเข้าสู่ระบบไว้แล้ว ให้ตรงไปยังหน้าแดชบอร์ดทันที
      if (localStorage.getItem('lawyer_admin_authenticated') === 'true') {
        window.location.replace('dashboard.html');
      }
    })();
  </script>
  <style>
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background: radial-gradient(circle at 50% 20%, #e2f1e6 0%, #f0f7f2 50%, #e6f0ea 100%);
      font-family: 'Prompt', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    .login-wrapper {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 30px 20px;
    }

    .login-container {
      width: 100%;
      max-width: 440px;
    }

    .login-card {
      background: var(--white);
      border-radius: var(--radius-lg);
      padding: 40px 36px;
      border: 1px solid rgba(82, 183, 136, 0.3);
      box-shadow: 0 20px 45px rgba(27, 67, 50, 0.1);
      position: relative;
      overflow: hidden;
    }

    .login-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 6px;
      background: linear-gradient(90deg, var(--primary-dark), var(--primary-light), var(--primary-mint));
    }

    .login-brand-header {
      text-align: center;
      margin-bottom: 28px;
    }

    .login-brand-icon {
      width: 62px;
      height: 62px;
      background: linear-gradient(135deg, var(--primary), var(--primary-light));
      color: var(--white);
      border-radius: 18px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 16px;
      box-shadow: 0 8px 20px rgba(45, 106, 79, 0.25);
    }

    .login-brand-icon svg {
      width: 32px;
      height: 32px;
    }

    .login-title {
      font-size: 1.55rem;
      font-weight: 700;
      color: var(--primary-dark);
      margin-bottom: 6px;
      line-height: 1.25;
    }

    .login-subtitle {
      font-size: 0.88rem;
      color: var(--text-muted);
      line-height: 1.5;
    }

    .login-alert {
      padding: 12px 16px;
      border-radius: var(--radius-md);
      font-size: 0.88rem;
      margin-bottom: 20px;
      display: none;
      align-items: center;
      gap: 10px;
      line-height: 1.5;
    }

    .login-alert.alert-error {
      background: #fee2e2;
      border: 1px solid #fca5a5;
      color: #991b1b;
      display: flex;
    }

    .login-alert.alert-success {
      background: #ecfdf5;
      border: 1px solid #a7f3d0;
      color: #065f46;
      display: flex;
    }

    .form-group-with-icon {
      position: relative;
      margin-bottom: 20px;
    }

    .form-group-with-icon label {
      display: block;
      font-size: 0.88rem;
      font-weight: 600;
      color: var(--text-main);
      margin-bottom: 7px;
    }

    .input-icon-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-icon-wrapper .input-leading-icon {
      position: absolute;
      left: 14px;
      color: var(--text-light);
      pointer-events: none;
      display: flex;
      align-items: center;
    }

    .input-icon-wrapper input {
      width: 100%;
      padding: 12px 42px 12px 42px;
      border: 1.5px solid var(--border-color);
      border-radius: var(--radius-md);
      font-size: 0.95rem;
      color: var(--text-main);
      background: #fbfdfc;
      transition: var(--transition);
      font-family: inherit;
    }

    .input-icon-wrapper input:focus {
      outline: none;
      border-color: var(--primary);
      background: var(--white);
      box-shadow: 0 0 0 3.5px var(--primary-soft);
    }

    .btn-toggle-password {
      position: absolute;
      right: 12px;
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      padding: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 6px;
      transition: var(--transition);
    }

    .btn-toggle-password:hover {
      color: var(--primary);
      background: rgba(82, 183, 136, 0.15);
    }

    .btn-login-submit {
      width: 100%;
      padding: 13px;
      font-size: 1.05rem;
      font-weight: 600;
      border-radius: var(--radius-md);
      background: linear-gradient(135deg, var(--primary), var(--primary-light));
      color: var(--white);
      border: none;
      cursor: pointer;
      box-shadow: 0 6px 18px rgba(45, 106, 79, 0.25);
      transition: var(--transition);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-top: 10px;
    }

    .btn-login-submit:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 22px rgba(45, 106, 79, 0.35);
      background: linear-gradient(135deg, var(--primary-dark), var(--primary));
    }

    .btn-login-submit:disabled {
      opacity: 0.7;
      cursor: not-allowed;
      transform: none;
    }

    .login-security-notice {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-size: 0.78rem;
      color: var(--text-muted);
      margin-top: 24px;
      padding-top: 20px;
      border-top: 1px solid var(--border-color);
      text-align: center;
    }

    .login-back-link {
      display: block;
      text-align: center;
      margin-top: 22px;
      color: var(--primary-dark);
      font-size: 0.9rem;
      font-weight: 500;
      transition: var(--transition);
    }

    .login-back-link:hover {
      color: var(--primary);
      text-decoration: underline;
    }

    /* สั่นเตือนเมื่อกรอกผิด */
    @keyframes shakeAnimation {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-8px); }
      40%, 80% { transform: translateX(8px); }
    }
    .shake {
      animation: shakeAnimation 0.4s cubic-bezier(0.36, 0.07, 0.19, 0.97) both;
    }
  </style>
</head>
<body>

  <div class="login-wrapper">
    <div class="login-container">
      <div class="login-card" id="loginCard">
        
        <!-- ส่วนหัวแบรนด์ -->
        <div class="login-brand-header">
          <div class="login-brand-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M12 3v18"></path>
              <path d="m3 7 9-4 9 4"></path>
              <path d="M3 7v2c0 2.8 2.2 5 5 5s5-2.2 5-5V7"></path>
              <path d="M11 7v2c0 2.8 2.2 5 5 5s5-2.2 5-5V7"></path>
            </svg>
          </div>
          <h1 class="login-title">ระบบผู้ดูแลสำนักงาน</h1>
          <p class="login-subtitle">สำนักงานทนายความชั้น 1 • จัดการคิวและเนื้อหาเว็บไซต์</p>
        </div>

        <!-- กล่องแจ้งเตือน (Error / Success Notification) -->
        <div id="loginAlert" class="login-alert">
          <span id="loginAlertIcon">⚠️</span>
          <span id="loginAlertText">อีเมลหรือรหัสผ่านไม่ถูกต้อง กรุณาตรวจสอบใหม่อีกครั้ง</span>
        </div>

        <!-- ฟอร์มเข้าสู่ระบบ -->
        <form id="adminLoginForm" onsubmit="handleLoginSubmit(event)">
          
          <!-- ฟิลด์อีเมล -->
          <div class="form-group-with-icon">
            <label for="adminEmail">อีเมลผู้ดูแลระบบ (Admin Email)</label>
            <div class="input-icon-wrapper">
              <span class="input-leading-icon">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                  <polyline points="22,6 12,13 2,6"></polyline>
                </svg>
              </span>
              <input
                type="email"
                id="adminEmail"
                name="email"
                placeholder="เช่น rxfixxxx@gmail.com"
                required
                autocomplete="email"
                autofocus>
            </div>
          </div>

          <!-- ฟิลด์รหัสผ่าน -->
          <div class="form-group-with-icon">
            <label for="adminPassword">รหัสผ่าน (Password)</label>
            <div class="input-icon-wrapper">
              <span class="input-leading-icon">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                  <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                </svg>
              </span>
              <input
                type="password"
                id="adminPassword"
                name="password"
                placeholder="ระบุรหัสผ่านเข้าสู่ระบบ"
                required
                autocomplete="current-password">
              <button
                type="button"
                class="btn-toggle-password"
                id="btnTogglePassword"
                onclick="togglePasswordVisibility()"
                title="แสดง/ซ่อนรหัสผ่าน"
                aria-label="แสดงหรือซ่อนรหัสผ่าน">
                <svg id="eyeIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                  <circle cx="12" cy="12" r="3"></circle>
                </svg>
              </button>
            </div>
          </div>

          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 22px; font-size: 0.85rem;">
            <label style="display: flex; align-items: center; gap: 8px; cursor: pointer; color: var(--text-main);">
              <input type="checkbox" id="rememberMe" checked style="accent-color: var(--primary);">
              <span>จดจำการเข้าสู่ระบบ</span>
            </label>
            <span style="color: var(--text-muted); font-size: 0.8rem;">สิทธิ์ระดับสูงสุด (Super Admin)</span>
          </div>

          <!-- ปุ่มส่งฟอร์ม -->
          <button type="submit" id="btnLoginSubmit" class="btn-login-submit">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
              <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path>
              <polyline points="10 17 15 12 10 7"></polyline>
              <line x1="15" y1="12" x2="3" y2="12"></line>
            </svg>
            <span>เข้าสู่ระบบแดชบอร์ด</span>
          </button>
        </form>

        <div class="login-security-notice">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path></svg>
          <span>การเชื่อมต่อได้รับการเข้ารหัส ปลอดภัยสำหรับข้อมูลลูกความ</span>
        </div>
      </div>

      <a href="../index.html" class="login-back-link">
        ← กลับสู่หน้าหลักเว็บไซต์สำนักงานทนายความ
      </a>
    </div>
  </div>

  <script src="../assets/js/main.js"></script>
  <script>
    // รหัสผ่านผู้ดูแลระบบที่กำหนดไว้
    const ADMIN_PASSWORD = 'Fee-065702';

    // สลับการมองเห็นรหัสผ่าน
    function togglePasswordVisibility() {
      const pwdInput = document.getElementById('adminPassword');
      const eyeIcon = document.getElementById('eyeIcon');
      if (!pwdInput) return;

      if (pwdInput.type === 'password') {
        pwdInput.type = 'text';
        eyeIcon.innerHTML = `
          <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
          <line x1="1" y1="1" x2="23" y2="23"></line>
        `;
      } else {
        pwdInput.type = 'password';
        eyeIcon.innerHTML = `
          <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
          <circle cx="12" cy="12" r="3"></circle>
        `;
      }
    }

    // จัดการการส่งฟอร์มล็อกอิน
    function handleLoginSubmit(event) {
      event.preventDefault();

      const emailInput = document.getElementById('adminEmail');
      const passwordInput = document.getElementById('adminPassword');
      const alertBox = document.getElementById('loginAlert');
      const alertText = document.getElementById('loginAlertText');
      const alertIcon = document.getElementById('loginAlertIcon');
      const submitBtn = document.getElementById('btnLoginSubmit');
      const card = document.getElementById('loginCard');

      const emailVal = (emailInput.value || '').trim();
      const passwordVal = (passwordInput.value || '');

      // ตรวจสอบ: พิมพ์อีเมลใดๆ ก็ได้ และรหัสผ่านถูกต้องตาม Fee-065702 หรือรหัสผ่านใหม่ที่ตั้งไว้
      const expectedPassword = localStorage.getItem('lawyer_admin_custom_password') || ADMIN_PASSWORD;
      if (emailVal && passwordVal === expectedPassword) {
        // สำเร็จ
        alertBox.className = 'login-alert alert-success';
        alertIcon.textContent = '✅';
        alertText.textContent = 'เข้าสู่ระบบสำเร็จ กำลังพาไปยังแดชบอร์ด...';
        alertBox.style.display = 'flex';

        submitBtn.disabled = true;
        submitBtn.innerHTML = `
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="animation: spin 1s linear infinite;"><line x1="12" y1="2" x2="12" y2="6"></line><line x1="12" y1="18" x2="12" y2="22"></line><line x1="4.93" y1="4.93" x2="7.76" y2="7.76"></line><line x1="16.24" y1="16.24" x2="19.07" y2="19.07"></line><line x1="2" y1="12" x2="6" y2="12"></line><line x1="18" y1="12" x2="22" y2="12"></line><line x1="4.93" y1="19.07" x2="7.76" y2="16.24"></line><line x1="16.24" y1="7.76" x2="19.07" y2="4.93"></line></svg>
          <span>กำลังเปลี่ยนหน้า...</span>
        `;

        // บันทึกสถานะการล็อกอินและอีเมลที่กรอกลงใน localStorage
        localStorage.setItem('lawyer_admin_authenticated', 'true');
        localStorage.setItem('lawyer_admin_email', emailVal);
        localStorage.setItem('lawyer_admin_login_at', new Date().toISOString());

        // บันทึกความเคลื่อนไหว
        if (typeof logActivity === 'function') {
          logActivity('เข้าสู่ระบบผู้ดูแลสำเร็จ', `ผู้ดูแลระบบ: ${emailVal} เข้าสู่ระบบแดชบอร์ด`, 'auth', '🔐');
        }

        setTimeout(() => {
          window.location.replace('dashboard.html');
        }, 500);

      } else {
        // รหัสผ่านไม่ถูกต้อง
        alertBox.className = 'login-alert alert-error';
        alertIcon.textContent = '❌';
        alertText.textContent = 'รหัสผ่านไม่ถูกต้อง กรุณาตรวจสอบใหม่อีกครั้ง';
        alertBox.style.display = 'flex';

        // บันทึกความเคลื่อนไหวแจ้งเตือน
        if (typeof logActivity === 'function') {
          logActivity('พยายามเข้าสู่ระบบไม่สำเร็จ', `รหัสผ่านไม่ถูกต้อง (อีเมลที่ใช้: ${emailVal || 'ไม่ระบุ'})`, 'auth', '⚠️');
        }

        // เอฟเฟกต์การสั่นเตือน
        card.classList.remove('shake');
        void card.offsetWidth; // trigger reflow
        card.classList.add('shake');

        passwordInput.value = '';
        passwordInput.focus();
      }
    }
  </script>
</body>
</html>
